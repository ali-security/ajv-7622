name: Build and Upload Artifact

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Build
        run: npm run build

      - name: Bundle
        run: npm run bundle

      - name: Remove .npmrc files before packing
        run: find . -name '.npmrc' -not -path './node_modules/*' -print -delete

      - name: Pack npm tarball
        run: npm pack

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ajv-build-${{ github.sha }}
          path: |
            dist/
            lib/
            *.tgz
          if-no-files-found: error
          retention-days: 30
